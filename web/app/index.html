<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<title>HandTalk</title>
<meta name="description" content="Recibe las palabras del guante traductor de lenguaje de señas HandTalk.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7FB; --surface:#FFFFFF; --soft:#EEF3F9; --line:#DCE4EE;
    --txt:#1F2A44; --muted:#66728C;
    --cyan:#1E9DB8; --purple:#7D44B8; --cyan-soft:#E3F4F8; --purple-soft:#F1E9F9;
    --ok:#1FA971; --warn:#E39A1B; --err:#E0506B;
    --grad:linear-gradient(135deg,var(--cyan),var(--purple));
    --shadow:0 6px 22px rgba(31,42,68,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    font-family:'Outfit',system-ui,sans-serif;color:var(--txt);background:var(--bg);
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-size:16px;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* ---------- Splash ---------- */
  #splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
  #splash img{width:min(52vw,230px);border-radius:50%;background:#fff;padding:10px;box-shadow:var(--shadow);animation:pulse 1.6s ease-in-out infinite}
  #splash h1{font-size:2.2rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  #splash.hide{opacity:0;pointer-events:none}
  @keyframes pulse{50%{transform:scale(1.04)}}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .logo{width:40px;height:40px;border-radius:50%;object-fit:contain;flex:none}
  header h1{font-size:1.3rem;font-weight:800;line-height:1}
  header h1 span{color:var(--purple)}
  header small{display:block;color:var(--muted);font-size:.72rem;font-weight:400;margin-top:3px}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:500;padding:6px 11px;
    border-radius:999px;background:var(--soft);white-space:nowrap;flex:none}
  .dot{width:9px;height:9px;border-radius:50%;background:#B8C1D1}
  .status.on{background:#E3F6EE;color:#12744D}.status.on .dot{background:var(--ok)}
  .status.busy{background:#FCF1DE;color:#8A5A07}.status.busy .dot{background:var(--warn);animation:blink .8s infinite}
  @keyframes blink{50%{opacity:.3}}

  main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px}

  /* ---------- Botones ---------- */
  .btn{min-height:50px;padding:12px 16px;border-radius:14px;font-weight:600;display:flex;
    align-items:center;justify-content:center;gap:8px;transition:transform .1s, background .2s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(125,68,184,.22)}
  .btn.ghost{background:var(--surface);border:1px solid var(--line)}
  .btn.danger{background:#FDECEF;border:1px solid #F3B7C2;color:#B3304A}
  .btn svg{width:20px;height:20px;flex:none}
  .connect{display:grid;grid-template-columns:1fr auto;gap:8px}
  .connect .ghost{padding:12px 14px}
  .more{display:none;grid-template-columns:1fr;gap:8px}
  .more.open{display:grid}
  .more .btn{justify-content:flex-start;text-align:left;font-weight:500}
  .more .btn small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}

  /* ---------- Palabra ---------- */
  .stage{position:relative;min-height:min(46vh,380px);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);
    border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 16px 28px;overflow:hidden;text-align:center}
  .stage::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad)}
  .stage .hand{font-size:2.6rem;margin-bottom:4px}
  .stage .label{color:var(--muted);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
  #word{font-size:clamp(2.4rem,12vw,6rem);font-weight:800;line-height:1.08;margin-top:8px;word-break:break-word;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px}
  #word.idle{font-size:clamp(1.05rem,4.6vw,1.5rem);font-weight:500;color:var(--muted);-webkit-text-fill-color:var(--muted);background:none;max-width:22em}
  #word.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .ripple{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--cyan-soft);animation:ripple .9s ease-out forwards;pointer-events:none;z-index:0}
  .stage > *:not(.ripple){position:relative;z-index:1}
  .stage .stage-actions{position:absolute;top:14px;right:12px}
  @keyframes ripple{to{width:620px;height:620px;opacity:0}}
  .stage-actions{display:flex;gap:6px}
  .icon-btn{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.active{background:var(--purple-soft);color:var(--purple)}

  /* ---------- Paneles ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
  .panel h2{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #phrase{min-height:42px;display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:7px 13px;border-radius:999px;background:var(--cyan-soft);color:#12677A;font-weight:600;animation:pop .35s}
  .phrase-empty{color:var(--muted);font-size:.9rem;align-self:center}
  .row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px;margin-top:12px}
  .row .btn{padding:10px 6px;min-height:46px;font-size:.93rem}

  #history{list-style:none;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:5px}
  #history li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--soft);font-weight:600}
  #history time{color:var(--muted);font-weight:400;font-size:.8rem;white-space:nowrap}
  #history .empty{background:none;color:var(--muted);font-weight:400;font-size:.9rem;padding:4px 0}
  .count{background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:2px 10px;font-size:.75rem;letter-spacing:0}

  /* ---------- Logos ---------- */
  footer{padding:8px 14px 18px;text-align:center}
  footer p{color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
  .logos{display:flex;justify-content:center;align-items:center;gap:8px}
  .logos img{height:56px;max-width:31%;object-fit:contain;border-radius:12px;padding:5px;background:#fff;border:1px solid var(--line)}
  .logos .l1{background:#000;border-color:#000}

  /* ---------- Aviso ---------- */
  #toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,160%);opacity:0;background:var(--txt);color:#fff;
    padding:12px 18px;border-radius:14px;width:max-content;max-width:92vw;transition:transform .35s,opacity .35s;z-index:40;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  #toast.show{transform:translate(-50%,0);opacity:1}
  #toast.err{background:#B3304A}

  /* ---------- Modo presentación ---------- */
  body.present header,body.present .connect,body.present .more,body.present .side,body.present footer p{display:none}
  body.present main{max-width:none}
  body.present .stage{flex:1;min-height:72vh}
  body.present #word{font-size:clamp(3rem,17vw,11rem)}

  .grid{display:flex;flex-direction:column;gap:12px}
  .side{display:flex;flex-direction:column;gap:12px}
  @media(min-width:800px){
    main{padding:20px}
    .grid{display:grid;grid-template-columns:1.5fr 1fr;align-items:start}
    .stage{min-height:420px}
  }
</style>
</head>
<body>

<div id="splash">
  <img src="img/2.jpeg" alt="Brigada Tecnológica R+IA">
  <h1>HandTalk</h1>
</div>

<header>
  <img class="logo" src="img/2.jpeg" alt="R+IA">
  <h1>Hand<span>Talk</span><small>Guante traductor de señas</small></h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Desconectado</span></div>
</header>

<main>
  <div class="grid">
    <section class="stage" id="stage">
      <div class="stage-actions">
        <button class="icon-btn active" id="btnVoice" title="Leer en voz alta" aria-label="Voz">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </button>
        <button class="icon-btn" id="btnPresent" title="Pantalla completa" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
      <div class="hand">🤟</div>
      <div class="label">Palabra detectada</div>
      <div id="word" class="idle">Toca «Conectar guante» para comenzar</div>
    </section>

    <div class="side">
      <div class="connect">
        <button class="btn primary" id="btnConnect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
          <span>Conectar guante</span>
        </button>
        <button class="btn ghost" id="btnMore" aria-expanded="false" aria-label="Más opciones">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
      <div class="more" id="more">
        <button class="btn ghost" id="btnBle"><span>Bluetooth LE<small>Para la versión con ESP32-C3</small></span></button>
        <button class="btn ghost" id="btnUsb"><span>Cable USB<small>Pruebas desde la computadora</small></span></button>
        <button class="btn ghost" id="btnDemo"><span>Modo demostración<small>Simula palabras sin el guante</small></span></button>
      </div>

      <section class="panel">
        <h2>Frase</h2>
        <div id="phrase"></div>
        <div class="row">
          <button class="btn primary" id="btnSpeak">Leer frase</button>
          <button class="btn ghost" id="btnUndo">Deshacer</button>
          <button class="btn ghost" id="btnClear">Limpiar</button>
        </div>
      </section>
      <section class="panel">
        <h2>Historial <span class="count" id="count">0</span></h2>
        <ul id="history"></ul>
      </section>
    </div>
  </div>
</main>

<footer>
  <p>Con el apoyo de</p>
  <div class="logos">
    <img class="l1" src="img/1.jpeg" alt="Gran Misión Ciencia, Tecnología e Innovación">
    <img src="img/2.jpeg" alt="Brigada Tecnológica R+IA - Liceo Caracciolo Parra y Olmedo">
    <img src="img/3.jpeg" alt="Mincyt">
  </div>
</footer>

<div id="toast"></div>

<script>
/* =========================================================
   HandTalk - Receptor de palabras del guante
   Conexiones soportadas:
   - Bluetooth Clásico (SPP) -> Web Serial API (Chrome Android 138+)
   - Bluetooth LE (Nordic UART) -> Web Bluetooth API
   - Cable USB -> Web Serial API (Chrome/Edge en PC)
   El guante debe enviar cada palabra terminada en salto de línea
   (SerialBT.println("HOLA");).
   ========================================================= */
const SPP_UUID  = '00001101-0000-1000-8000-00805f9b34fb';
const NUS_SVC   = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX    = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const FLUSH_MS  = 400;   // si llega texto sin salto de línea, se muestra tras esta pausa

const $ = id => document.getElementById(id);
const state = { mode:null, port:null, reader:null, bleDevice:null, buffer:'', flushTimer:null,
                voice:true, phrase:[], history:[], demoTimer:null, wakeLock:null };

/* ---------- UI helpers ---------- */
function toast(msg, isErr=false){
  const t=$('toast'); t.textContent=msg; t.className=isErr?'show err':'show';
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='',3500);
}
function setStatus(kind, text){
  $('status').className='status'+(kind?' '+kind:''); $('statusText').textContent=text;
  const connected = kind==='on';
  $('btnConnect').querySelector('span').textContent = connected ? 'Desconectar' : 'Conectar guante';
  $('btnConnect').className = connected ? 'btn danger' : 'btn primary';
}
function showIdle(msg){ const w=$('word'); w.className='idle'; w.textContent=msg; }

/* ---------- Palabras entrantes ---------- */
function handleWord(raw){
  const word = raw.replace(/[\r\n]+/g,' ').trim();
  if(!word) return;
  const w=$('word'); w.className=''; void w.offsetWidth; w.textContent=word; w.className='pop';
  const r=document.createElement('span'); r.className='ripple'; $('stage').appendChild(r); setTimeout(()=>r.remove(),1000);
  if(navigator.vibrate) navigator.vibrate(60);

  state.phrase.push(word); renderPhrase();
  state.history.unshift({word, time:new Date()}); if(state.history.length>100) state.history.pop(); renderHistory();
  if(state.voice) speak(word);
}
function feed(text){
  state.buffer += text;
  const parts = state.buffer.split(/\r?\n|\r/);
  state.buffer = parts.pop();
  parts.forEach(handleWord);
  clearTimeout(state.flushTimer);
  if(state.buffer.trim()) state.flushTimer=setTimeout(()=>{ handleWord(state.buffer); state.buffer=''; }, FLUSH_MS);
}
function renderPhrase(){
  const p=$('phrase'); p.innerHTML='';
  if(!state.phrase.length){ p.innerHTML='<span class="phrase-empty">Las palabras se irán uniendo aquí</span>'; return; }
  state.phrase.forEach(w=>{ const c=document.createElement('span'); c.className='chip'; c.textContent=w; p.appendChild(c); });
}
function renderHistory(){
  const h=$('history'); h.innerHTML='';
  if(!state.history.length){ h.innerHTML='<li class="empty">Todavía no llegan palabras</li>'; }
  state.history.forEach(({word,time})=>{
    const li=document.createElement('li');
    li.innerHTML=`<span></span><time>${time.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time>`;
    li.firstChild.textContent=word; h.appendChild(li);
  });
  $('count').textContent=state.history.length;
}

/* ---------- Voz ---------- */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.toLowerCase());
  u.lang='es-ES';
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));
  if(v) u.voice=v;
  u.rate=0.95; speechSynthesis.speak(u);
}

/* ---------- Conexión: Web Serial (Bluetooth clásico / USB) ---------- */
async function connectSerial(bluetooth){
  if(!('serial' in navigator)){
    toast(bluetooth ? 'Este navegador no soporta Bluetooth clásico. Usa Google Chrome actualizado en Android.'
                    : 'Este navegador no soporta conexión por cable. Usa Chrome o Edge en la PC.', true);
    return;
  }
  try{
    setStatus('busy','Buscando…');
    const opts = bluetooth ? { filters:[{bluetoothServiceClassId:SPP_UUID}], allowedBluetoothServiceClassIds:[SPP_UUID] } : {};
    const port = await navigator.serial.requestPort(opts);
    await port.open({ baudRate:115200 });
    state.port=port; state.mode=bluetooth?'bt':'usb';
    setStatus('on', bluetooth?'Bluetooth':'USB');
    showIdle('Esperando señas…'); toast('Guante conectado ✔');
    keepAwake();
    readSerialLoop(port);
  }catch(e){
    setStatus('', 'Desconectado');
    if(e.name!=='NotFoundError') toast('No se pudo conectar: '+e.message, true);
  }
}
async function readSerialLoop(port){
  const decoder=new TextDecoder();
  while(port.readable && state.port===port){
    const reader=port.readable.getReader(); state.reader=reader;
    try{
      while(true){
        const {value,done}=await reader.read();
        if(done) break;
        if(value) feed(decoder.decode(value,{stream:true}));
      }
    }catch(e){ console.warn(e); break; }
    finally{ reader.releaseLock(); }
  }
  if(state.port===port) onDisconnected();
}

/* ---------- Conexión: Web Bluetooth (BLE UART) ---------- */
async function connectBle(){
  if(!('bluetooth' in navigator)){ toast('Este navegador no soporta Bluetooth LE. Usa Google Chrome.', true); return; }
  try{
    setStatus('busy','Buscando…');
    const device=await navigator.bluetooth.requestDevice({ filters:[{services:[NUS_SVC]}], optionalServices:[NUS_SVC] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server=await device.gatt.connect();
    const svc=await server.getPrimaryService(NUS_SVC);
    const tx=await svc.getCharacteristic(NUS_TX);
    const decoder=new TextDecoder();
    tx.addEventListener('characteristicvaluechanged', ev=>feed(decoder.decode(ev.target.value)));
    await tx.startNotifications();
    state.bleDevice=device; state.mode='ble';
    setStatus('on','BLE'); showIdle('Esperando señas…'); toast('Guante conectado ✔'); keepAwake();
  }catch(e){
    setStatus('','Desconectado');
    if(e.name!=='NotFoundError') toast('No se pudo conectar: '+e.message, true);
  }
}

/* ---------- Desconexión ---------- */
async function disconnect(){
  const {port,reader,bleDevice}=state;
  stopDemo();
  state.port=null; state.bleDevice=null;
  try{ if(reader) await reader.cancel(); }catch{}
  try{ if(port) await port.close(); }catch{}
  try{ if(bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect(); }catch{}
  onDisconnected();
}
function onDisconnected(){
  state.mode=null; state.port=null; state.bleDevice=null;
  setStatus('','Desconectado'); showIdle('Toca «Conectar guante» para comenzar');
  if(state.wakeLock){ state.wakeLock.release().catch(()=>{}); state.wakeLock=null; }
}

/* ---------- Modo demostración ---------- */
const DEMO_WORDS=['HOLA','BUENOS DÍAS','YO','ESTUDIO','EN EL LICEO','GRACIAS','AYUDA','AMIGO','TE QUIERO','ADIÓS'];
function startDemo(){
  stopDemo(); state.mode='demo'; setStatus('on','Demo'); showIdle('Esperando señas…');
  let i=0; state.demoTimer=setInterval(()=>feed(DEMO_WORDS[i++ % DEMO_WORDS.length]+'\n'),2600);
  toast('Modo demostración: se simulan palabras del guante');
}
function stopDemo(){ clearInterval(state.demoTimer); state.demoTimer=null; }

/* ---------- Pantalla siempre encendida ---------- */
async function keepAwake(){ try{ if('wakeLock' in navigator) state.wakeLock=await navigator.wakeLock.request('screen'); }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && state.mode) keepAwake(); });

/* ---------- Eventos ---------- */
$('btnConnect').onclick=()=> state.mode ? disconnect() : connectSerial(true);
$('btnMore').onclick=()=>{ const m=$('more'); m.classList.toggle('open'); $('btnMore').setAttribute('aria-expanded',m.classList.contains('open')); };
$('btnBle').onclick=()=>{ $('more').classList.remove('open'); if(state.mode) disconnect(); connectBle(); };
$('btnUsb').onclick=()=>{ $('more').classList.remove('open'); if(state.mode) disconnect(); connectSerial(false); };
$('btnDemo').onclick=()=>{ $('more').classList.remove('open'); if(state.mode && state.mode!=='demo') disconnect(); startDemo(); };
$('btnVoice').onclick=()=>{ state.voice=!state.voice; $('btnVoice').classList.toggle('active',state.voice); toast(state.voice?'Voz activada':'Voz desactivada'); };
$('btnSpeak').onclick=()=>{ if(state.phrase.length) speak(state.phrase.join(' ')); else toast('Aún no hay palabras en la frase'); };
$('btnUndo').onclick=()=>{ state.phrase.pop(); renderPhrase(); };
$('btnClear').onclick=()=>{ state.phrase=[]; renderPhrase(); };
$('btnPresent').onclick=async()=>{
  const on=!document.body.classList.contains('present');
  document.body.classList.toggle('present',on); $('btnPresent').classList.toggle('active',on);
  try{ if(on) await document.documentElement.requestFullscreen(); else if(document.fullscreenElement) await document.exitFullscreen(); }catch{}
};
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement){ document.body.classList.remove('present'); $('btnPresent').classList.remove('active'); } });
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};

renderPhrase(); renderHistory();
window.addEventListener('load',()=>setTimeout(()=>$('splash').classList.add('hide'),1200));
if(new URLSearchParams(location.search).has('demo')) startDemo();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
